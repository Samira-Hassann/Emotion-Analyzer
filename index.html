<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emotion Analyzer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
@property --a1{syntax:'<color>';inherits:true;initial-value:#14b8a6}
@property --a2{syntax:'<color>';inherits:true;initial-value:#6366f1}
:root{transition:--a1 .9s ease,--a2 .9s ease}
:root{
  --bg1:#f4f7fb;--bg2:#faf6f2;--card:rgba(255,255,255,.85);--text:#1e1b4b;--muted:#6b7090;--line:#e4e7f5;--track:#eceefa;
  --a1:#14b8a6;--a2:#6366f1;--shadow:0 20px 50px -22px color-mix(in srgb,var(--a1) 55%,transparent);
}
@media (prefers-color-scheme:dark){
  :root{--bg1:#0b111d;--bg2:#15111f;--card:rgba(28,30,58,.85);--text:#eef0ff;--muted:#a3a8cc;--line:#2d3057;--track:#272a50;--shadow:0 20px 50px -20px rgba(0,0,0,.6)}
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--text);font-family:"Plus Jakarta Sans","Segoe UI",Tahoma,Arial,sans-serif;
  background:radial-gradient(900px 500px at 10% -10%,color-mix(in srgb,var(--a1) 22%,transparent),transparent),
             radial-gradient(800px 500px at 100% 0%,color-mix(in srgb,var(--a2) 20%,transparent),transparent),
             linear-gradient(160deg,var(--bg1),var(--bg2));background-attachment:fixed;-webkit-font-smoothing:antialiased}
.wrap{max-width:680px;margin:0 auto;padding:36px 18px 48px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:34px;font-size:.85rem;color:var(--muted)}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:1.05rem;color:var(--text)}
.logo span{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;color:#fff;font-size:1.1rem;background:linear-gradient(135deg,var(--a1),var(--a2));box-shadow:0 8px 18px -8px var(--a1)}
.st{display:flex;align-items:center;gap:7px}
.dot{width:8px;height:8px;border-radius:50%;background:#9ca3af}.dot.ok{background:#22c55e;box-shadow:0 0 0 4px rgba(34,197,94,.18)}.dot.bad{background:#ef4444}
h1{text-align:center;font-size:clamp(2rem,6vw,2.9rem);line-height:1.1;font-weight:800;letter-spacing:-.03em;margin:0 0 12px}
h1 em{font-style:normal;background:linear-gradient(135deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{text-align:center;color:var(--muted);margin:0 auto 28px;max-width:46ch}
.card{background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}
.input{padding:18px}
textarea{width:100%;min-height:120px;resize:none;border:1px solid var(--line);border-radius:16px;padding:14px 16px;font:500 1rem/1.55 inherit;color:var(--text);background:color-mix(in srgb,var(--card) 70%,transparent);outline:none;transition:border-color .15s,box-shadow .15s}
textarea:focus{border-color:var(--a1);box-shadow:0 0 0 4px color-mix(in srgb,var(--a1) 18%,transparent)}
.row{display:flex;gap:10px;margin-top:12px;align-items:center}
.go{flex:1;border:0;border-radius:14px;padding:14px;font:700 1rem inherit;color:#fff;cursor:pointer;background:linear-gradient(135deg,var(--a1),var(--a2));box-shadow:0 12px 24px -12px var(--a1);transition:transform .1s,filter .15s}
.go:hover{filter:brightness(1.07)}.go:active{transform:scale(.985)}.go:disabled{opacity:.6;cursor:progress}
.clr{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:14px;padding:14px 18px;font:600 .95rem inherit;cursor:pointer}
.clr:hover{color:var(--text)}
button:focus-visible{outline:2px solid var(--a1);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;justify-content:center}
.chip{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:7px 14px;font:500 .85rem inherit;cursor:pointer;transition:transform .12s,border-color .12s}
.chip:hover{transform:translateY(-1px);border-color:var(--a1)}
.emo{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.res{margin-top:22px;padding:30px 24px 22px}
.big{text-align:center}
.face{font-size:5.2rem;line-height:1;display:inline-block}
.pop{animation:pop .6s cubic-bezier(.2,.9,.3,1.3)}
@keyframes pop{0%{transform:scale(.4) rotate(-12deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
.lab{font-size:2rem;font-weight:800;letter-spacing:-.02em;margin-top:8px}
.pill{display:inline-block;margin-top:8px;padding:5px 14px;border-radius:999px;font-weight:600;font-size:.85rem;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c)}
.bars{margin-top:26px;display:grid;gap:13px}
.b{display:grid;grid-template-columns:30px 82px 1fr 52px;align-items:center;gap:10px;font-size:.92rem}
.b .em{font-size:1.35rem;text-align:center}
.b .nm{font-weight:600}
.trk{height:10px;border-radius:999px;background:var(--track);overflow:hidden}
.fill{height:100%;width:0;border-radius:999px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.pc{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.b.top .nm,.b.top .pc{color:var(--text);font-weight:700}
.foot2{display:flex;justify-content:space-between;gap:10px;margin-top:20px;padding-top:14px;border-top:1px solid var(--line);font-size:.8rem;color:var(--muted)}
.cp{background:none;border:0;color:var(--a1);font:600 .8rem inherit;cursor:pointer;padding:0}
.err{margin-top:16px;padding:12px 16px;border-radius:14px;background:rgba(239,68,68,.1);color:#ef4444;font-size:.9rem;text-align:center}
.hist{margin-top:22px;padding:18px 20px}
.hist h2{margin:0 0 6px;font-size:.95rem;font-weight:700}
.hi{display:flex;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer;font-size:.9rem}
.hi:last-child{border:0}.hi .em{font-size:1.25rem}
.hi .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.hi:hover .t{color:var(--text)}.hi b{font-weight:600}
.note{text-align:center;color:var(--muted);font-size:.78rem;margin-top:26px}
.hide{display:none!important}
@media (max-width:480px){.b{grid-template-columns:28px 70px 1fr 46px;gap:8px;font-size:.85rem}.face{font-size:4.2rem}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.face{font-size:0}
.face img{width:124px;height:124px;display:block;filter:drop-shadow(0 16px 16px rgba(0,0,0,.22))}
.ei{width:32px;height:32px;display:block;margin:auto;filter:drop-shadow(0 3px 3px rgba(0,0,0,.18))}
.ci{width:22px;height:22px;display:block}
.chip{display:inline-flex;align-items:center;gap:8px}
.logo span img{width:24px;height:24px;display:block}
.b{grid-template-columns:34px 82px 1fr 52px}
.hi .ei{width:26px;height:26px;margin:0}
@media (max-width:480px){.face img{width:98px;height:98px}.b{grid-template-columns:30px 70px 1fr 46px}}

.wrap{padding-top:44px}
.faces{display:flex;justify-content:center;margin-bottom:22px}
.faces img{width:68px;height:68px;margin:0 -7px;transform:translateY(var(--y)) rotate(var(--r));filter:drop-shadow(0 12px 12px rgba(0,0,0,.22))}
h1{margin-bottom:14px}
.sub{margin-bottom:30px}
.input{padding:20px}
.chips{margin-top:16px}
.res{margin-top:24px}
.note{margin-top:30px;line-height:1.6}
@media (max-width:480px){.wrap{padding-top:30px}.faces img{width:52px;height:52px;margin:0 -6px}}

.lab{background-clip:text;-webkit-background-clip:text;color:transparent}
.face{position:relative;isolation:isolate}
.face::before{content:"";position:absolute;inset:-18px;border-radius:50%;z-index:-1;
  background:radial-gradient(circle,color-mix(in srgb,var(--a1) 38%,transparent),transparent 68%)}
.pill{background:color-mix(in srgb,var(--c) 15%,transparent)}
</style>
</head>
<body>
<div class="wrap">
  <div class="faces" id="faces" aria-hidden="true"></div>

  <h1>Understand the <em>emotion</em><br>behind any text</h1>
  <p class="sub">Paste a sentence and get an instant read across six emotions, powered by a fine-tuned ModernBERT model.</p>

  <div class="card input">
    <textarea id="text" maxlength="5000" placeholder="Type or paste English text here..." aria-label="Text to analyze"></textarea>
    <div class="row">
      <button class="go" id="go" type="button">Analyze emotion</button>
      <button class="clr" id="clr" type="button">Clear</button>
    </div>
    <div class="chips" id="chips"></div>
  </div>

  <div id="err" class="err hide" role="alert"></div>

  <div class="card res hide" id="res" aria-live="polite">
    <div class="big">
      <div class="face emo" id="face"></div>
      <div class="lab" id="lab"></div>
      <span class="pill" id="pill"></span>
    </div>
    <div class="bars" id="bars"></div>
    <div class="foot2"><span id="cl"></span><button class="cp" id="cp" type="button">Copy JSON</button></div>
  </div>

  <div class="card hist hide" id="hist"><h2>Recent</h2><div id="hl"></div></div>

  <p class="note">ModernBERT-base fine-tuned on GoEmotions · English text only · 3D emoji by Microsoft Fluent Emoji (MIT)</p>
</div>

const M={
 anger:{n:"Anger",c:"#ef4444",c2:"#f2622f"},
 disgust:{n:"Disgust",c:"#6a9c3e",c2:"#9ab83a"},
 fear:{n:"Fear",c:"#7c5cf0",c2:"#a56cf2"},
 joy:{n:"Joy",c:"#f59e0b",c2:"#f97316"},
 sadness:{n:"Sadness",c:"#3b7cf4",c2:"#34a5f0"},
 surprise:{n:"Surprise",c:"#ec4899",c2:"#d946ef"}
};
const S=[["joy","I am so happy today!"],["disgust","This is absolutely disgusting."],["fear","I'm terrified of what might happen."],["surprise","I can't believe you actually did that!"],["sadness","I miss him so much, it hurts."]];
const $=i=>document.getElementById(i);
let last=null,hist=[];
try{hist=JSON.parse(localStorage.getItem("h")||"[]")}catch(e){}
const mm=k=>M[k]||{n:k,c:"#14b8a6",c2:"#6366f1"};

S.forEach(([e,t])=>{const b=document.createElement("button");b.type="button";b.className="chip";
  b.innerHTML='<img class="ci" alt="" src="'+IMG[e]+'">';b.append(t);b.onclick=()=>{$("text").value=t;run()};$("chips").appendChild(b)});

function show(d){
  last=d;const m=mm(d.predicted_emotion);
  const f=$("face");f.innerHTML='<img alt="'+m.n+'" src="'+IMG[d.predicted_emotion]+'">';f.classList.remove("pop");void f.offsetWidth;f.classList.add("pop");
  $("lab").textContent=m.n;$("lab").style.backgroundImage="linear-gradient(90deg,"+m.c+","+m.c2+")";
  const R=document.documentElement.style;R.setProperty("--a1",m.c);R.setProperty("--a2",m.c2);
  $("pill").textContent=(d.confidence*100).toFixed(1)+"% confident";$("pill").style.setProperty("--c",m.c);
  const bars=$("bars");bars.innerHTML="";
  Object.entries(d.probabilities).sort((a,b)=>b[1]-a[1]).forEach(([k,p],i)=>{
    const x=mm(k),r=document.createElement("div");r.className="b"+(i===0?" top":"");
    r.innerHTML='<img class="ei" alt="" src="'+IMG[k]+'"><span class="nm">'+x.n+'</span><div class="trk"><div class="fill" style="background:linear-gradient(90deg,'+x.c+','+x.c2+')"></div></div><span class="pc">'+(p*100).toFixed(1)+'%</span>';
    bars.appendChild(r);requestAnimationFrame(()=>requestAnimationFrame(()=>{r.querySelector(".fill").style.width=(p*100)+"%"}));
  });
  const c=d.cleaned_text;$("cl").textContent="Processed: "+c.slice(0,60)+(c.length>60?"…":"");
  $("res").classList.remove("hide");$("err").classList.add("hide");
}
function err(m){$("err").textContent=m;$("err").classList.remove("hide")}
async function run(){
  const t=$("text").value.trim();if(!t){err("Enter some text first.");return}
  const b=$("go");b.disabled=true;b.textContent="Analyzing...";
  try{
    const r=await fetch("/predict",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:t})});
    if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(typeof e.detail==="string"?e.detail:"Request failed. Check that the server is running.")}
    const d=await r.json();show(d);
    hist=[{t,e:d.predicted_emotion},...hist.filter(h=>h.t!==t)].slice(0,5);
    try{localStorage.setItem("h",JSON.stringify(hist))}catch(e){}drawHist();
  }catch(e){err(e.message)}finally{b.disabled=false;b.textContent="Analyze emotion"}
}
function drawHist(){
  $("hist").classList.toggle("hide",!hist.length);const l=$("hl");l.innerHTML="";
  hist.forEach(h=>{const m=mm(h.e),d=document.createElement("div");d.className="hi";d.tabIndex=0;
    d.innerHTML='<img class="ei" alt="" src="'+IMG[h.e]+'"><span class="t"></span><b style="color:'+m.c+'">'+m.n+'</b>';
    d.querySelector(".t").textContent=h.t;
    const go=()=>{$("text").value=h.t;run();scrollTo({top:0,behavior:"smooth"})};
    d.onclick=go;d.onkeydown=e=>{if(e.key==="Enter")go()};l.appendChild(d)});
}
$("go").onclick=run;
$("clr").onclick=()=>{$("text").value="";$("res").classList.add("hide");$("err").classList.add("hide");document.documentElement.style.removeProperty("--a1");document.documentElement.style.removeProperty("--a2");$("text").focus()};
$("text").addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.ctrlKey||e.metaKey))run()});
$("cp").onclick=async()=>{if(!last)return;try{await navigator.clipboard.writeText(JSON.stringify(last,null,2));$("cp").textContent="Copied";setTimeout(()=>$("cp").textContent="Copy JSON",1400)}catch(e){}};
Object.keys(M).forEach((k,i)=>{const im=document.createElement("img");im.src=IMG[k];im.alt="";im.style.setProperty("--r",[-12,-6,-2,3,7,12][i]+"deg");im.style.setProperty("--y",[6,-2,-8,-8,-2,6][i]+"px");$("faces").appendChild(im)});
drawHist();
</script>
